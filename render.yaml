services:
  - type: web
    name: inventory-portfolio-demo
    runtime: node
    plan: free
    branch: portfolio-demo
    autoDeployTrigger: "off"
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix client
    startCommand: node server/start-demo.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: VITE_DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO
        sync: false
